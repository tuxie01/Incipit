[package]
name = "incipit"
version = "0.1.6"
edition = "2021"
description = "Incipit ticket server (MCP over stdio), permission guard and project admin CLI"
license = "GPL-3.0-only"

[[bin]]
name = "incipit"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
